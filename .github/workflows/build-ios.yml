name: Build iOS IPA + Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS archive
        run: |
          export NODE_BINARY=$(which node)
          xcodebuild \
            -workspace ios/Stundennachweis.xcworkspace \
            -scheme Stundennachweis \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/Stundennachweis.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            NODE_BINARY="$NODE_BINARY" \
            archive

      - name: Inspect built app
        run: |
          APP_PATH=$(find ./build/Stundennachweis.xcarchive/Products/Applications -name "*.app" | head -1)
          echo "=== App bundle: $APP_PATH ==="
          ls -la "$APP_PATH"
          echo
          echo "=== Launch screen / display Info.plist keys ==="
          PLIST="$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :UILaunchStoryboardName" "$PLIST" 2>/dev/null || echo "MISSING: UILaunchStoryboardName"
          /usr/libexec/PlistBuddy -c "Print :UILaunchScreen" "$PLIST" 2>/dev/null || echo "MISSING: UILaunchScreen"
          /usr/libexec/PlistBuddy -c "Print :UIRequiresFullScreen" "$PLIST" 2>/dev/null || echo "(no UIRequiresFullScreen)"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$PLIST" 2>/dev/null || echo "(no MinimumOSVersion)"
          /usr/libexec/PlistBuddy -c "Print :UIDeviceFamily" "$PLIST" 2>/dev/null || echo "(no UIDeviceFamily)"
          /usr/libexec/PlistBuddy -c "Print :RCTNewArchEnabled" "$PLIST" 2>/dev/null || echo "(no RCTNewArchEnabled)"
          echo
          echo "=== Launch / storyboard resources in bundle ==="
          ls "$APP_PATH" | grep -i -E "storyboard|launch|splash" || echo "NONE FOUND — app will run in scaled compatibility mode"
          echo
          echo "=== JS bundle present? ==="
          ls -la "$APP_PATH/main.jsbundle" 2>/dev/null || echo "MISSING: main.jsbundle"

      - name: Package as IPA
        run: |
          APP_PATH=$(find ./build/Stundennachweis.xcarchive/Products/Applications -name "*.app" | head -1)
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload Stundennachweis.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stundennachweis-ipa
          path: Stundennachweis.ipa
          retention-days: 30

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild
        run: npx expo prebuild --platform android --clean

      - name: Decode keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > android/app/stundennachweis.p12

      - name: Build release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/stundennachweis.p12 \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stundennachweis-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
