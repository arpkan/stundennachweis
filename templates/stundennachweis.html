<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <style>
    @page { size: A4 landscape; margin: 15mm; }
    body { font-family: 'Times New Roman', Times, serif; font-size: 11pt; color: #000; }
    h1 { font-size: 14pt; text-align: center; margin-bottom: 4mm; }
    .meta { display: flex; justify-content: space-between; margin-bottom: 6mm; font-size: 11pt; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #f0f0f0; font-weight: bold; font-size: 10pt; padding: 3mm 2mm; border: 1px solid #555; text-align: center; }
    td { padding: 2.5mm 2mm; border: 1px solid #555; font-size: 10pt; text-align: center; }
    tr:nth-child(even) td { background: #fafafa; }
    .footer { margin-top: 8mm; display: flex; justify-content: space-between; font-size: 11pt; }
    .signature { border-top: 1px solid #000; width: 60mm; padding-top: 1mm; }
  </style>
</head>
<body>
  <h1>Stundennachweis für den Monat: {{MONAT_JAHR}}</h1>
  <div class="meta">
    <span>Name, Vorname: <strong>{{FAHRER_NAME}}</strong></span>
  </div>
  <table>
    <thead>
      <tr>
        <th>Datum</th>
        <th>Beginn Fahrt</th>
        <th>Ankunft Schule / Werkstätte</th>
        <th>Abfahrt Schule / Werkstätte</th>
        <th>Ende Fahrt</th>
        <th>Gesamtzeit</th>
        <th>Tour-Nr.</th>
        <th>Besonderheiten</th>
        <th>aufgezeichnet am</th>
      </tr>
    </thead>
    <tbody>
      {{ZEILEN}}
    </tbody>
  </table>
  <div class="footer">
    <div class="signature">Unterschrift</div>
    <div><strong>Gesamt: {{GESAMT_ZEIT}}</strong></div>
  </div>
</body>
</html>
